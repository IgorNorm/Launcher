name: Build Goldberg Multi-OS

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Optional upstream repo URL'
        required: false

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest] # Ubuntu 22.04 стабільніша для Qt5
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fix Submodules & Missing Files
        shell: bash
        run: |
          # 1. Примусове оновлення підмодулів
          git submodule update --init --recursive
          
          # 2. Створення заглушки для notsecrets (якщо порожня)
          if [ ! -f "notsecrets/CMakeLists.txt" ]; then
            mkdir -p notsecrets
            echo 'add_library(notsecrets INTERFACE)' > notsecrets/CMakeLists.txt
            echo 'target_include_directories(notsecrets INTERFACE .)' >> notsecrets/CMakeLists.txt
          fi

          # 3. ФІКС ПОМИЛКИ Qt: Якщо файл ресурсів не знайдено, CMake бере шлях папки.
          # Створюємо мінімальний .qrc файл, якщо його немає
          mkdir -p launcher/resources
          if [ ! -f "launcher/resources/launcher.qrc" ]; then
            echo '<RCC><qresource prefix="/"></qresource></RCC>' > launcher/resources/launcher.qrc
          fi

      - name: Determine upstream URL
        id: upstream
        shell: bash
        run: |
          URL="${{ github.event.inputs.upstream_repo }}"
          if [ -z "$URL" ]; then URL="${{ vars.UPSTREAM_REPO }}"; fi
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Sync Upstream
        if: steps.upstream.outputs.url != ''
        shell: bash
        run: |
          git remote add upstream "${{ steps.upstream.outputs.url }}"
          git fetch upstream --tags || true
          git checkout -B build-upstream upstream/develop || git checkout -B build-upstream upstream/main || echo "Staying on current branch"
          git submodule update --init --recursive

      # --- LINUX ---
      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev \
            libprotobuf-dev protobuf-compiler \
            libsdl2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev \
            qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools \
            extra-cmake-modules zlib1g-dev

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          export CMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake/Qt5
          # Використовуємо -S . -B build для чіткості
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH \
            -DLauncher_BUILD_PLATFORM=linux \
            -Wno-dev
          cmake --build build -j$(nproc)

      # --- WINDOWS ---
      - name: Install Qt (Windows)
        if: matrix.os == 'windows-latest'
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # На Windows теж створюємо заглушку, якщо треба
          if (!(Test-Path "notsecrets/CMakeLists.txt")) {
            New-Item -ItemType Directory -Force -Path "notsecrets"
            Set-Content -Path "notsecrets/CMakeLists.txt" -Value "add_library(notsecrets INTERFACE)`ntarget_include_directories(notsecrets INTERFACE .)"
          }
          
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -Wno-dev
          cmake --build build --config Release

      # --- ARTIFACTS ---
      - name: Collect and Upload
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: |
            build/bin/
            build/launcher/
            bin/
            build/Release/
            *.exe
            *.dll
            *.so
          if-no-files-found: warn
          

name: Build Goldberg Multi-OS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Optional upstream repo URL'
        required: false

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # <--- КРИТИЧНО ВАЖЛИВО: Завантажує ресурси

      - name: Determine upstream URL
        id: upstream
        shell: bash
        run: |
          URL="${{ github.event.inputs.upstream_repo }}"
          if [ -z "$URL" ]; then URL="${{ vars.UPSTREAM_REPO }}"; fi
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Sync Upstream
        if: steps.upstream.outputs.url != ''
        shell: bash
        run: |
          git remote add upstream "${{ steps.upstream.outputs.url }}"
          git fetch upstream --tags || true
          
          # Переключаємось на код upstream
          if git checkout -B build-upstream upstream/main 2>/dev/null || git checkout -B build-upstream upstream/master 2>/dev/null; then
             echo "Switched to upstream branch"
          else
             echo "Using local source"
          fi
          
          # Оновлюємо підмодулі для upstream коду (якщо вони змінилися)
          git submodule sync
          git submodule update --init --recursive

      # --- LINUX SETUP & BUILD ---
      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Додано extra-cmake-modules (часто потрібен для Qt/KDE проектів)
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev \
            libprotobuf-dev protobuf-compiler \
            libsdl2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev \
            qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools \
            extra-cmake-modules zlib1g-dev

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Вказуємо шлях до Qt явно
          export CMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake/Qt5
          
          # Створюємо папку build, якщо її немає (для чистоти)
          rm -rf build && mkdir build

          if [ -f ./build_linux.sh ]; then
            chmod +x ./build_linux.sh
            ./build_linux.sh
          else
            # Додаємо -Wno-dev, щоб прибрати попередження, які ти бачив в логах
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH -Wno-dev
            cmake --build build -j$(nproc)
          fi

      # --- WINDOWS SETUP & BUILD ---
      - name: Install Qt (Windows)
        if: matrix.os == 'windows-latest'
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: '${{ github.workspace }}/qt5'
          setup-python: 'false'

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          Qt5_DIR: ${{ env.Qt5_DIR }}
        run: |
          Write-Host "Qt installed at: $env:Qt5_DIR"
          
          if (Test-Path .\build_win_release.bat) {
            .\build_win_release.bat
          } else {
            cmake -B build -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_PREFIX_PATH="$env:Qt5_DIR" `
              -Wno-dev
            cmake --build build --config Release
          }

      # --- ARTIFACTS ---
      - name: Collect and Upload
        uses: actions/upload-artifact@v4
        with:
          name: goldberg-${{ matrix.os }}
          path: |
            build/bin/
            bin/
            build/Release/
            goldberg_emulator*
            *.dll
            *.so
          if-no-files-found: warn
          

name: Build Goldberg Multi-OS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Optional upstream repo URL'
        required: false

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine upstream URL
        id: upstream
        shell: bash
        run: |
          # Пріоритет: Input -> Variable -> Empty
          URL="${{ github.event.inputs.upstream_repo }}"
          if [ -z "$URL" ]; then URL="${{ vars.UPSTREAM_REPO }}"; fi
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Sync Upstream
        if: steps.upstream.outputs.url != ''
        shell: bash
        run: |
          git remote add upstream "${{ steps.upstream.outputs.url }}"
          git fetch upstream --tags || true
          # Спроба переключитися на гілку upstream, якщо вона існує
          git checkout -B build-upstream upstream/main || git checkout -B build-upstream upstream/master || echo "Using local source"

      # --- LINUX BUILD ---
      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev libprotobuf-dev \
            protobuf-compiler libsdl2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f ./build_linux.sh ]; then
            chmod +x ./build_linux.sh && ./build_linux.sh
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j$(nproc)
          fi

      # --- WINDOWS BUILD ---
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path .\build_win_release.bat) {
            .\build_win_release.bat
          } else {
            cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release
          }

      # --- ARTIFACTS ---
      - name: Collect and Upload
        uses: actions/upload-artifact@v4
        with:
          name: goldberg-${{ matrix.os }}
          path: |
            build/bin/
            bin/
            build/Release/
            goldberg*
          if-no-files-found: warn
          

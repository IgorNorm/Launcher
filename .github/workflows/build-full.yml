name: Build Goldberg Multi-OS

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Optional upstream repo URL'
        required: false

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive # Намагаємось завантажити одразу

      - name: Force Update Submodules
        shell: bash
        run: |
          # Якщо checkout не завантажив підмодулі (наприклад, папка notsecrets порожня)
          git submodule update --init --recursive

      - name: Determine upstream URL
        id: upstream
        shell: bash
        run: |
          URL="${{ github.event.inputs.upstream_repo }}"
          if [ -z "$URL" ]; then URL="${{ vars.UPSTREAM_REPO }}"; fi
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Sync Upstream
        if: steps.upstream.outputs.url != ''
        shell: bash
        run: |
          git remote add upstream "${{ steps.upstream.outputs.url }}"
          git fetch upstream --tags || true
          git checkout -B build-upstream upstream/main || git checkout -B build-upstream upstream/develop || git checkout -B build-upstream upstream/master || echo "Staying on current branch"
          git submodule sync
          git submodule update --init --recursive

      # --- LINUX ---
      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev \
            libprotobuf-dev protobuf-compiler \
            libsdl2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev \
            qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools \
            extra-cmake-modules zlib1g-dev libghc-zlib-dev

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          export CMAKE_PREFIX_PATH=/usr/lib/x86_64-linux-gnu/cmake/Qt5
          # Створюємо заглушку для notsecrets, якщо вона все ще порожня
          if [ ! -d "notsecrets" ] || [ -z "$(ls -A notsecrets)" ]; then
            mkdir -p notsecrets
            echo 'add_library(notsecrets INTERFACE)' > notsecrets/CMakeLists.txt
          fi
          
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH -Wno-dev
          cmake --build build -j$(nproc)

      # --- WINDOWS ---
      - name: Install Qt (Windows)
        if: matrix.os == 'windows-latest'
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (!(Test-Path "notsecrets") -or (Get-ChildItem "notsecrets").Count -eq 0) {
            New-Item -ItemType Directory -Force -Path "notsecrets"
            Set-Content -Path "notsecrets/CMakeLists.txt" -Value "add_library(notsecrets INTERFACE)"
          }
          
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -Wno-dev
          cmake --build build --config Release

      # --- ARTIFACTS ---
      - name: Collect and Upload
        uses: actions/upload-artifact@v4
        with:
          name: goldberg-${{ matrix.os }}
          path: |
            build/bin/
            bin/
            build/Release/
            build/launcher/
            goldberg*
            *.dll
            *.so
            

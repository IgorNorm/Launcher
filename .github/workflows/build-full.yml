- name: Determine upstream URL
        id: upstream
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_UPSTREAM: ${{ github.event.inputs.upstream_repo || '' }}
          VAR_UPSTREAM: ${{ vars.UPSTREAM_REPO || '' }}
        run: |
          # priority: workflow_dispatch input -> repository variable UPSTREAM_REPO -> empty
          echo "EVENT_NAME='$EVENT_NAME'"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_UPSTREAM" ]; then
            echo "url=$INPUT_UPSTREAM" >> $GITHUB_OUTPUT
          elif [ -n "$VAR_UPSTREAM" ]; then
            echo "url=$VAR_UPSTREAM" >> $GITHUB_OUTPUT
          else
            echo "url=" >> $GITHUB_OUTPUT
          fi

      - name: Setup build dependencies Linux
        if: matrix.os == 'ubuntu-latest'
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
          NEEDRESTART_MODE: a
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git \
            libssl-dev libprotobuf-dev protobuf-compiler \
            libsdl2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev ccache || {
              echo "apt install failed, attempting to fix broken installs"
              sudo apt-get -y -f install || true
              exit 1
            }
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Setup build dependencies Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          CHOCO_NO_PROGRESS: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Windows runner: enabling choco global confirmation and ensuring basic tools"
          # Enable non-interactive choco
          choco feature enable -n allowGlobalConfirmation || Write-Host "choco feature already enabled or failed"
          # Install minimal tools if missing (no-op if already present)
          try {
            choco install -y --no-progress git cmake visualstudio2019buildtools || Write-Host "choco install returned non-zero; continuing"
          } catch {
            Write-Host "choco install failed: $($_.Exception.Message)"
          }
          # Ensure pwsh path is not hardcoded elsewhere; use current pwsh
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"

      - name: Build on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path .\build_win_release.bat) {
            Write-Host "Running build_win_release.bat"
            & .\build_win_release.bat
          } else {
            if (-not (Test-Path build)) { New-Item -ItemType Directory -Path build | Out-Null }
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
            cmake --build build --config Release -- /m
          }

      - name: Collect artifacts
        run: |
          set -e || true
          mkdir -p release_artifacts || true
          if [ -d build/bin ]; then cp -r build/bin/* release_artifacts/ 2>/dev/null || true; fi
          if [ -d bin ]; then cp -r bin/* release_artifacts/ 2>/dev/null || true; fi
          if [ -f goldberg ]; then cp goldberg release_artifacts/ 2>/dev/null || true; fi
          if [ -d build/Release ]; then cp -r build/Release/* release_artifacts/ 2>/dev/null || true; fi
          ls -la release_artifacts || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goldberg-${{ matrix.os }}
          path: release_artifacts/**
          if-no-files-found: warn

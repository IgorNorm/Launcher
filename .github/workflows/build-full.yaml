name: Build Goldberg (Linux + Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Optional upstream repo URL to ensure latest (e.g. https://gitlab.com/Mr_Goldberg/goldberg_emulator.git)'
        required: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure latest from upstream if provided
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_repo != '' }} || ${{ github.event_name != 'workflow_dispatch' && env.UPSTREAM_REPO != '' }}
        env:
          UPSTREAM: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_repo || env.UPSTREAM_REPO }}
        run: |
          git remote add upstream "$UPSTREAM" || true
          git fetch upstream --tags --prune
          UPSTREAM_HEAD=$(git rev-parse upstream/HEAD || git rev-parse upstream/master || true)
          if [ -n "$UPSTREAM_HEAD" ]; then
            echo "Found upstream HEAD: $UPSTREAM_HEAD"
            git checkout -B build-upstream "$UPSTREAM_HEAD"
          else
            echo "No upstream HEAD found, staying on current checkout"
          fi

      - name: Setup build deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config git \
            libssl-dev libprotobuf-dev protobuf-compiler libsdl2-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libgl1-mesa-dev ccache || true

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ -f ./build_linux.sh ]; then
            chmod +x ./build_linux.sh
            ./build_linux.sh
          else
            mkdir -p build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release
            cmake --build . -- -j$(nproc)
          fi

      - name: Setup build deps (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Write-Host "Using Windows runner. Ensure Visual Studio Build Tools are available."
          # optional: install nuget/conan or other tools here

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          if (Test-Path .\build_win_release.bat) {
            .\build_win_release.bat
          } else {
            Write-Host "No build script found; try msbuild on CMake solution if present"
            if (Test-Path .\build\Goldberg.sln) {
              msbuild .\build\Goldberg.sln /p:Configuration=Release /m
            }
          }

      - name: Collect artifacts
        run: |
          mkdir -p release_artifacts || true
          # Linux/Windows: adjust paths if needed
          cp -r build/bin/* release_artifacts/ 2>/dev/null || true
          cp -r bin/* release_artifacts/ 2>/dev/null || true
          cp goldberg* release_artifacts/ 2>/dev/null || true
          ls -la release_artifacts || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goldberg-${{ matrix.os }}
          path: release_artifacts
